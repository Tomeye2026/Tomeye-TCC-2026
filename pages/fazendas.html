<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a7a4a">
  <meta name="description" content="Tomeye — Gerencie suas fazendas e propriedades rurais.">
  <title>Fazendas — Tomeye</title>
  <link rel="icon" type="image/png" href="../assets/imagens/logo2.png">
  <link rel="apple-touch-icon" href="../assets/imagens/logo2.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
  <div id="app">

    <!-- Cabeçalho -->
    <header class="page-header">
      <a href="dashboard.html" class="page-header-back"><span class="material-symbols-rounded">arrow_back</span></a>
      <h1 class="page-header-title">Fazendas</h1>
      <button class="page-header-action" id="btn-nova-fazenda">+ Nova</button>
    </header>

    <main class="main-content">
      <!-- Lista de fazendas -->
      <div id="fazendas-list">
        <div class="empty-state">
          <div class="spinner spinner-dark spinner-sm"></div>
        </div>
      </div>
    </main>

    <!-- Modal de formulário de fazenda (oculto) -->
    <div id="fazenda-form-modal" class="hidden">
      <div class="modal-backdrop" id="fazenda-modal-backdrop">
        <div class="modal" style="max-height: 90vh; overflow-y: auto;">
          <h3 class="modal-title" id="fazenda-form-title">Nova Fazenda</h3>

          <form id="fazenda-form" novalidate>
            <input type="hidden" id="fazenda-id" value="">

            <div class="form-group">
              <label class="form-label required" for="fazenda-nome">Nome da fazenda</label>
              <input type="text" id="fazenda-nome" class="form-control" placeholder="Ex: Fazenda São João" required>
              <span class="form-error"></span>
            </div>

            <div class="flex gap-sm">
              <div class="form-group" style="flex:2">
                <label class="form-label required" for="fazenda-cidade">Cidade</label>
                <input type="text" id="fazenda-cidade" class="form-control" required>
                <span class="form-error"></span>
              </div>
              <div class="form-group" style="flex:1">
                <label class="form-label required" for="fazenda-estado">UF</label>
                <select id="fazenda-estado" class="form-control form-select" required>
                  <option value="">UF</option>
                  <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
                  <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
                  <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
                  <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
                  <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
                  <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
                  <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
                  <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
                  <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                </select>
                <span class="form-error"></span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="fazenda-area">Área cultivada (ha)</label>
              <input type="number" id="fazenda-area" class="form-control" placeholder="Ex: 150" min="0" step="0.1">
            </div>



            <div class="modal-actions">
              <button type="submit" class="btn btn-primary btn-full" id="btn-salvar-fazenda">Salvar fazenda</button>
              <button type="button" class="btn btn-ghost btn-full" id="btn-cancelar-fazenda">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>

  <!-- Firebase SDK (compat) — com defer para não bloquear o parser -->
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script defer src="../js/firebase-config.js"></script>
  <script defer src="../js/api.js"></script>
  <script defer src="../js/app.js"></script>
  <script defer src="../js/auth.js"></script>
  <script defer src="../js/fazendas.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => Fazendas.init());
  </script>
</body>
</html>
